version: 0.0

os: linux

files:
  - source: /
    destination: /home/ec2-user/aws-devops-student-project

hooks:
  ApplicationStop:
    - location: scripts/stop_application.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 60
      runas: root
